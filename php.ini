; Felkyo Creatures — PHP settings for the LIVE server (Railway / Railpack).
;
; WHY THIS FILE EXISTS: Railway builds the site with Railpack, which runs PHP
; on FrankenPHP and reads a php.ini from the project root if there is one.
; Without it, PHP's built-in defaults apply — and the default cap on a single
; uploaded file is 2 MB, smaller than the 5 MB the creator's panel accepts
; (config/config.php, 'art' → max_bytes, signed off 2026-08-21). A 3 MB
; background would then be refused by PHP before the site ever saw it, with
; a message that blames the file. This file raises the two limits that
; govern uploads, and nothing else.
;
; THE TWO NUMBERS: post_max_size must be larger than upload_max_filesize,
; because the whole form (file + fields + the CSRF token) has to fit under
; it. Both are a little above the site's own 5 MB cap on purpose: the site's
; cap is the rule people see, and these are the room it needs to be checked
; at all. Raise the site's cap and these must rise with it.
;
; ON YOUR OWN MACHINE this file does nothing — XAMPP reads its own php.ini
; (C:\xampp\php\php.ini), which already allows 40 MB. The Pictures screen
; shows a warning if the server it runs on allows LESS than the site's cap,
; so a mismatch is never silent.

; post_max_size was 8M while uploads were one file at a time. The Pictures
; screen now takes several files in one go (2026-11-04), so the whole form
; must fit a batch: 64M is about ten full-size files, and PHP itself takes at
; most max_file_uploads files per request.
upload_max_filesize = 6M
post_max_size = 64M
max_file_uploads = 20

; Enough room to re-encode a 2048×2048 still PNG through GD (about 16 MB of
; pixels plus the file itself). PHP's default is 128M, which is already
; enough; stated here so the assumption is written down.
memory_limit = 128M
